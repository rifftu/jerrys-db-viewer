# Copy to ~/.config/jerrys-db-viewer/connections.toml
# (or anywhere, and point DB_VIEWER_CONFIG at it).
# The file is re-read whenever the app lists connections or opens a new one.
#
# Fields mirror a pg_service.conf entry:
#   host     default "localhost"
#   port     default 5432
#   user     required
#   dbname   default: same as user
#   password default: none
#   sslmode  disable | prefer (default) | require | verify-ca | verify-full
#            prefer/require encrypt without verifying the certificate, like libpq.

[[connection]]
name = "local"
user = "postgres"
dbname = "postgres"

[[connection]]
name = "staging"
host = "db.example.com"
port = 5432
user = "readonly"
dbname = "app"
password = ""
sslmode = "require"
