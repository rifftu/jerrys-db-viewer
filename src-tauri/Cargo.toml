[package]
name = "jerrys-db-viewer"
version = "0.1.0"
edition = "2021"

[lib]
name = "db_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
tokio = { version = "1.53.1", features = ["sync", "macros"] }
tokio-postgres = "0.7.18"
toml = "1.1.6"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
