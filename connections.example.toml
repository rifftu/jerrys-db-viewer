# Copy to ~/.config/jerrys-db-viewer/connections.toml
# (or anywhere, and point DB_VIEWER_CONFIG at it).
# The file is re-read whenever the app lists connections or opens a new one.

[[connection]]
name = "local"
url = "postgres://postgres@localhost:5432/postgres"

[[connection]]
name = "staging"
# libpq URL or key=value string; sslmode defaults to "prefer".
url = "host=db.example.com port=5432 user=readonly dbname=app sslmode=require"
password = ""
# Accept self-signed / unverifiable TLS certificates (what libpq's sslmode=require does).
tls_insecure = true
